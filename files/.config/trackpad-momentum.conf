# Settings for ~/.local/bin/trackpad-momentum. Restart it after a change:
#   systemctl --user restart trackpad-momentum

# Multiplies how far the momentum scrolls. Raise it if momentum feels short.
speed = 1.0

# Speed kept per millisecond. Higher glides longer; lower stops sooner.
deceleration = 0.998

# How fast a flick must be (mm/s) to start momentum. Raise it if small
# movements still glide.
start_speed = 100

# Window classes that do NOT get momentum, because they have their own (a
# regular expression). Every other app gets it.
skip_apps = ^(org\.gnome\..*|nautilus|firefox|firefox-.*|librewolf)$
