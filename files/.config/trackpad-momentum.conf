# Settings for ~/.local/bin/trackpad-momentum. Restart it after a change:
#   systemctl --user restart trackpad-momentum

# Multiplies how far the momentum scrolls. Raise it if momentum feels short.
speed = 1.0

# Speed kept per millisecond. Higher glides longer; 0.998 is the macOS feel.
deceleration = 0.998

# Window classes that get momentum (a regular expression). GTK apps such as
# Files have their own momentum, so leave them out.
apps = ^(chromium|Chromium|google-chrome|chrome-.*|obsidian|com\.t3tools\.T3Code|t3code|Electron|code|Code|Slack|discord)$
