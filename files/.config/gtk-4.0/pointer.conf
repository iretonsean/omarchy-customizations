# Widgets that show the pointer cursor in GTK 4 apps started with
# gtk4-pointer-run (Files starts that way). One widget per line: a CSS node
# name, then optional .classes, as in gtk.css. The app's own cursors win.

# Sidebar rows, list rows and grid items
row.activatable
child.activatable

# Buttons, menu items, switches and check boxes
button
modelbutton
switch
checkbutton
